<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About RialtoBot</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    max-width: 42rem;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.7;
    color: #1f2328;
    background: #ffffff;
  }
  h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0; }
  h2 { font-size: 1.25rem; font-weight: 600; margin-top: 2.5rem; }
  p, ul { margin-top: 1rem; }
  .ua, pre {
    margin-top: 1rem;
    border-radius: 0.5rem;
    background: #f6f8fa;
    padding: 0.75rem 1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    word-break: break-all;
  }
  pre { white-space: pre-wrap; }
  /* Must come after the base rules above: media queries don't add
     specificity, so an override declared earlier in source order loses
     to a later unconditional rule targeting the same selector. */
  @media (prefers-color-scheme: dark) {
    body { color: #e6edf3; background: #0d1117; }
    .ua, pre { background: #161b22; }
  }
</style>
</head>
<body>
  <h1>About RialtoBot</h1>
  <p>
    RialtoBot is a small, automated crawler.
  </p>

  <h2>Block it</h2>
  <p>Add this to your robots.txt:</p>
  <pre>User-agent: RialtoBot
Disallow: /</pre>
  <p>We check robots.txt before every visit. Disallow us, and we stop.</p>

  <h2>User-Agent</h2>
  <p class="ua">RialtoBot/1.0 (+https://bot.rialto.st/; contact@rialto.st)</p>
</body>
</html>
